name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A243EF: ${{ secrets.A243EF }}
          BC87AE: ${{ secrets.BC87AE }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A243EF', ''), os.environ.get('BC87AE', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 4c1c3f5e4db9dfa7cc537647d3b360 -->', a)
          if b:
              patched = patched.replace('<!-- 6fc67fe35df5d43493955c05fa -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
